name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install swift-format and SwiftLint
        run: brew install swift-format swiftlint

      - name: Show tool versions
        run: |
          swift-format --version
          swiftlint --version

      - name: swift-format (lint mode, strict)
        run: swift-format lint --recursive --strict --configuration .swift-format Sources Tests Benchmarks/Sources

      - name: SwiftLint (strict)
        run: swiftlint --strict

  macos:
    name: Test macOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Benchmarks (smoke, quick mode)
        run: swift run --package-path Benchmarks -c release FPBracketBenchmarks --quick

  ios:
    name: Test iOS
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test (iOS Simulator)
        run: |
          DEVICE=$(xcrun simctl list devices available --json | jq -r '[.devices[] | .[] | select(.name | startswith("iPhone"))][0].name')
          if [ -z "${DEVICE}" ] || [ "${DEVICE}" = "null" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "Simulator: ${DEVICE}"
          xcodebuild test -scheme fp-swift-bracket -destination "platform=iOS Simulator,name=${DEVICE}"

  linux:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test
