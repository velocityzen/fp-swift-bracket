name: Property tests

# The Hegel property tests, deep and randomized. Pushes and pull requests run
# them in ci.yml at each property's own count, with Hegel's derandomized `ci`
# profile, so they see the same inputs every time; this run is where new
# inputs come from.
on:
  schedule:
    # Daily at 05:17 UTC, off the hour, when scheduled runs pile up.
    - cron: "17 5 * * *"
  workflow_dispatch:

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same pinned toolchain installer as ci.yml.
  SWIFTLY_VERSION: "1.2.0"
  SWIFTLY_SHA256: a1b48692b00ea6902957423473c87bee7c7f3e18c015a4a09317102f6820b987
  SWIFT_VERSION: "6.4"
  # hegel.toml's nightly profile: new inputs every run instead of the
  # derandomized ones.
  HEGEL_DEFAULT_PROFILE: nightly
  # Each property runs 20 times its own count, so the costliest (500 cases)
  # runs 10,000 and the others 20,000 to 40,000: about 3 minutes on an
  # M-series Mac, and the default counts run 2 to 3 times slower on CI. A
  # profile's test_cases would lose to the properties' own counts.
  HEGEL_TEST_CASES_SCALE: "20"

jobs:
  # A scheduled run has no change to compare with, so zizmor audits every
  # workflow first; the other jobs wait for it.
  zizmor:
    name: zizmor
    uses: $/.github/workflows/zizmor.yml

  macos:
    name: Property tests macOS
    needs: zizmor
    # Package.swift needs macOS 27, which only the xcode-27 image (a public
    # preview) runs; macos-26 can't launch what it builds.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The SDK swift.org's toolchain builds against, as in ci.yml.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        run: |
          curl -fsSLo "$RUNNER_TEMP/swiftly.pkg" "https://download.swift.org/swiftly/darwin/swiftly-$SWIFTLY_VERSION.pkg"
          echo "$SWIFTLY_SHA256  $RUNNER_TEMP/swiftly.pkg" | shasum -a 256 -c -
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --assume-yes --quiet-shell-followup --skip-install
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes --use "$SWIFT_VERSION"
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter FPBracketPropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      # Each failure's report, from the issue through its test's "failed
      # after" line. A Hegel report ends with the trait that replays it, so
      # the failing case can be run locally. A report can be any length: a
      # draw may print across many lines.
      - name: Show failures
        if: failure()
        shell: bash
        run: |
          awk '
            /recorded an issue/ { shown = 0; on = 1 }
            on { print; shown++ }
            on && (/failed after/ || shown >= 200) { on = 0; print "" }
          ' "$RUNNER_TEMP/property-tests.log" | cut -c1-400

  linux:
    name: Property tests Linux ${{ matrix.arch }}
    needs: zizmor
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      image: swift:6.4

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        run: |
          set -o pipefail
          HEGEL_STATISTICS=1 swift test --filter FPBracketPropertyTests 2>&1 \
            | tee "$RUNNER_TEMP/property-tests.log"

      - name: Show failures
        if: failure()
        shell: bash
        run: |
          awk '
            /recorded an issue/ { shown = 0; on = 1 }
            on { print; shown++ }
            on && (/failed after/ || shown >= 200) { on = 0; print "" }
          ' "$RUNNER_TEMP/property-tests.log" | cut -c1-400
