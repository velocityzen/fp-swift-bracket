name: aarch64 crash hunt

# Run by hand only. The nightly property tests crash on Linux aarch64, and
# only there: a libdispatch worker dereferences 0xffffffff89abcdef
# (DISPATCH_OBJECT_LISTLESS) taken from the default-QoS global queue, the one
# Swift Concurrency runs tasks and `Task.sleep` wake-ups on. It never
# happened in 24 runs on Apple Silicon, so it is hunted on the runners it
# happens on.
#
# So far the whole suite, its tests running together as the nightly runs
# them, crashed 2 times in 6 runs; one test at a time, and each property
# alone, never did in about as much time. So each job here runs the whole
# suite with its tests together, `runs` times: once as the nightly does, to
# measure how often it crashes, and once without each property, to find the
# one it needs. A job runs every run, crash or not, and fails at the end if
# any crashed. Delete this workflow once it has found the property.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per job
        type: number
        default: 8

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The nightly run's settings; see property-tests.yml.
  HEGEL_DEFAULT_PROFILE: nightly
  HEGEL_TEST_CASES_SCALE: "20"

jobs:
  zizmor:
    name: zizmor
    uses: $/.github/workflows/zizmor.yml

  hunt:
    name: ${{ matrix.name }}
    needs: zizmor
    runs-on: ubuntu-24.04-arm
    # A whole-suite run takes 5 to 6 minutes on these runners.
    timeout-minutes: 120
    container:
      image: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Whole suite
          - name: Without bracketsMatchTheModel
            skip: BracketProperties/bracketsMatchTheModel
          - name: Without asyncBracketsMatchTheModel
            skip: BracketProperties/asyncBracketsMatchTheModel
          - name: Without cancellingTheCallerStillReleasesEverything
            skip: BracketProperties/cancellingTheCallerStillReleasesEverything
          - name: Without sequenceIsTheFlatMapChain
            skip: BracketProperties/sequenceIsTheFlatMapChain
          - name: Without doChainsMatchTheModel
            skip: DoNotationProperties/doChainsMatchTheModel
          - name: Without asyncDoChainsMatchTheModel
            skip: DoNotationProperties/asyncDoChainsMatchTheModel

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      # Each run's output is folded into a group, with a crash's backtrace.
      # The tally goes to the log and the run's summary page.
      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        env:
          RUNS: ${{ inputs.runs }}
          SKIP: ${{ matrix.skip }}
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          if ! [[ "$RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::runs must be a positive whole number, not \"$RUNS\"."
            exit 1
          fi
          args=(--skip-build --filter FPBracketPropertyTests)
          if [ -n "$SKIP" ]; then
            args+=(--skip "$SKIP")
          fi
          crashed=() failed=()
          for i in $(seq 1 "$RUNS"); do
            log="$RUNNER_TEMP/run-$i.log"
            echo "::group::Run $i of $RUNS"
            status=0
            HEGEL_STATISTICS=1 swift test "${args[@]}" 2>&1 | tee "$log" || status=$?
            echo "::endgroup::"
            if grep -qE "Program crashed|unexpected signal" "$log"; then
              crashed+=("$i")
              echo "::error::Run $i of $RUNS crashed."
              grep -E "^\*\*\* |crashed:" "$log"
            elif [ "$status" -ne 0 ]; then
              failed+=("$i")
              echo "::error::Run $i of $RUNS failed without crashing (exit $status)."
            else
              echo "Run $i of $RUNS passed."
            fi
          done
          tally="$NAME: ${#crashed[@]} of $RUNS runs crashed${crashed:+ (${crashed[*]})}"
          tally+=", ${#failed[@]} failed without crashing${failed:+ (${failed[*]})}"
          echo "$tally"
          echo "- $tally" >> "$GITHUB_STEP_SUMMARY"
          [ "${#crashed[@]}" -eq 0 ] && [ "${#failed[@]}" -eq 0 ]
