name: aarch64 crash hunt

# Run by hand only. The nightly property tests crash on Linux aarch64, and
# only there: a libdispatch worker dereferences 0xffffffff89abcdef
# (DISPATCH_OBJECT_LISTLESS) taken from the default-QoS global queue, the one
# Swift Concurrency runs tasks and `Task.sleep` wake-ups on. It never
# happened in 24 runs on Apple Silicon, so it is hunted on the runners it
# happens on.
#
# So far: the whole suite, its tests running together, crashed in about one
# run in four; one test at a time, and each property alone 3 times, never
# did. Leaving out each property in turn, 8 runs each, every suite with
# asyncDoChainsMatchTheModel crashed (12 of 48 runs) and the one without it
# never did (0 of 8), which luck alone gives about 1 time in 10.
#
# So each job here runs asyncDoChainsMatchTheModel: alone, twice as many
# runs, to see whether it needs other tests beside it; beside each other
# property, to see which; and the whole suite without it once more, to see
# that it then still never crashes. A job runs every run, crash or not, and
# fails at the end if any crashed. Delete this workflow once it is settled.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per job; the alone job runs twice as many
        type: number
        default: 8

# The jobs only read the repository; none of them needs a write token.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The nightly run's settings; see property-tests.yml.
  HEGEL_DEFAULT_PROFILE: nightly
  HEGEL_TEST_CASES_SCALE: "20"

jobs:
  zizmor:
    name: zizmor
    uses: $/.github/workflows/zizmor.yml

  hunt:
    name: ${{ matrix.name }}
    needs: zizmor
    runs-on: ubuntu-24.04-arm
    # A whole-suite run takes 5 to 6 minutes on these runners.
    timeout-minutes: 120
    container:
      image: swift:6.4
    strategy:
      fail-fast: false
      matrix:
        # `filters` are the tests a run runs, any one of them matching;
        # `skip` leaves some out; `factor` multiplies the runs.
        include:
          - name: asyncDoChainsMatchTheModel alone
            filters: DoNotationProperties/asyncDoChainsMatchTheModel
            factor: 2
          - name: asyncDoChainsMatchTheModel and bracketsMatchTheModel
            filters: DoNotationProperties/asyncDoChainsMatchTheModel BracketProperties/bracketsMatchTheModel
          - name: asyncDoChainsMatchTheModel and asyncBracketsMatchTheModel
            filters: DoNotationProperties/asyncDoChainsMatchTheModel BracketProperties/asyncBracketsMatchTheModel
          - name: asyncDoChainsMatchTheModel and cancellingTheCallerStillReleasesEverything
            filters: DoNotationProperties/asyncDoChainsMatchTheModel BracketProperties/cancellingTheCallerStillReleasesEverything
          - name: asyncDoChainsMatchTheModel and sequenceIsTheFlatMapChain
            filters: DoNotationProperties/asyncDoChainsMatchTheModel BracketProperties/sequenceIsTheFlatMapChain
          - name: asyncDoChainsMatchTheModel and doChainsMatchTheModel
            filters: DoNotationProperties/asyncDoChainsMatchTheModel DoNotationProperties/doChainsMatchTheModel
          - name: Whole suite without asyncDoChainsMatchTheModel
            filters: FPBracketPropertyTests
            skip: DoNotationProperties/asyncDoChainsMatchTheModel

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      # Each run's output is folded into a group, with a crash's backtrace.
      # The tally goes to the log and the run's summary page.
      - name: Property tests (${{ env.HEGEL_DEFAULT_PROFILE }} profile)
        shell: bash
        env:
          RUNS: ${{ inputs.runs }}
          FACTOR: ${{ matrix.factor || 1 }}
          FILTERS: ${{ matrix.filters }}
          SKIP: ${{ matrix.skip }}
          NAME: ${{ matrix.name }}
        run: |
          set -o pipefail
          if ! [[ "$RUNS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::runs must be a positive whole number, not \"$RUNS\"."
            exit 1
          fi
          runs=$((RUNS * FACTOR))
          args=(--skip-build)
          for filter in $FILTERS; do
            args+=(--filter "$filter")
          done
          if [ -n "$SKIP" ]; then
            args+=(--skip "$SKIP")
          fi
          crashed=() failed=()
          for i in $(seq 1 "$runs"); do
            log="$RUNNER_TEMP/run-$i.log"
            echo "::group::Run $i of $runs"
            status=0
            HEGEL_STATISTICS=1 swift test "${args[@]}" 2>&1 | tee "$log" || status=$?
            echo "::endgroup::"
            if grep -qE "Program crashed|unexpected signal" "$log"; then
              crashed+=("$i")
              echo "::error::Run $i of $runs crashed."
              grep -E "^\*\*\* |crashed:" "$log"
            elif [ "$status" -ne 0 ]; then
              failed+=("$i")
              echo "::error::Run $i of $runs failed without crashing (exit $status)."
            else
              echo "Run $i of $runs passed."
            fi
          done
          tally="$NAME: ${#crashed[@]} of $runs runs crashed${crashed:+ (${crashed[*]})}"
          tally+=", ${#failed[@]} failed without crashing${failed:+ (${failed[*]})}"
          echo "$tally"
          echo "- $tally" >> "$GITHUB_STEP_SUMMARY"
          [ "${#crashed[@]}" -eq 0 ] && [ "${#failed[@]}" -eq 0 ]
